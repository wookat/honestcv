<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- prettier-ignore -->
    <meta name="description" content="HonestCV: the resume builder you pay for once — currently free during beta. ATS-friendly templates, free ATS match score, AI rewrites, real PDF & DOCX export. No subscription, no auto-renewal, no trial trap." />
    <title>HonestCV — One-Time Payment Resume Builder. No Subscriptions, Ever.</title>
    <link rel="canonical" href="https://cv.zalize.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HonestCV" />
    <meta property="og:title" content="HonestCV — One-Time Payment Resume Builder. No Subscriptions, Ever." />
    <!-- prettier-ignore -->
    <meta property="og:description" content="HonestCV: the resume builder you pay for once — currently free during beta. ATS-friendly templates, free ATS match score, AI rewrites, real PDF & DOCX export." />
    <meta property="og:url" content="https://cv.zalize.com/" />
    <meta property="og:image" content="https://cv.zalize.com/og2.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "HonestCV",
        "url": "https://cv.zalize.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "ATS-friendly resume builder with a free ATS match score, AI rewrites, and real PDF & DOCX export. One-time payment, no subscription — currently free during beta.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Will my resume pass ATS systems?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Our templates are single-column, real-text layouts — the format ATS parsers handle best. The PDF export is text-based (selectable, parseable), never an image, and the DOCX is a genuine Word document."
            }
          },
          {
            "@type": "Question",
            "name": "Where is my data stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In your browser (localStorage). We have no accounts and no resume database. The only content that reaches our server is text you explicitly send for AI rewriting, which is processed and returned, not stored."
            }
          }
        ]
      }
    </script>
    <!-- First-party pageview beacon; external file so CSP needs no inline scripts -->
    <script defer src="/t.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
