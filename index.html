    <meta
      property="og:description"
      content="HonestCV: the resume builder you pay for once — currently in beta with a full free trial. ATS-friendly templates, free ATS match score, AI rewrites, real PDF & DOCX export."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "HonestCV",
        "url": "https://cv.zalize.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "ATS-friendly resume builder with a free ATS match score, AI rewrites, and real PDF & DOCX export. One-time payment, no subscription — currently in beta with a full free trial.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Will my resume pass ATS systems?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Our templates are single-column, real-text layouts — the format ATS parsers handle best. The PDF export is text-based (selectable, parseable), never an image, and the DOCX is a genuine Word document."
            }
          },
          {
            "@type": "Question",
            "name": "Where is my data stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In your browser (localStorage). We have no accounts and no resume database. The only content that reaches our server is text you explicitly send for AI rewriting, which is processed and returned, not stored."
            }
          }
        ]
      }
    </script>
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "d3ace0c72c2f4a6f8b96f1e7f8fd4dac"}'
    ></script>
    <script>
      // First-party pageview beacon (adblock-proof fallback; path + external
      // referrer origin on the first hit only, no PII). Browsers with the
      // honestcv.qa flag (internal QA) are excluded from stats.
      ;(function () {
        try {
          if (localStorage.getItem('honestcv.qa') === '1') return
        } catch (e) {
          /* ignore */
        }
        var sent = ''
        var hit = function () {
          var p = location.pathname
          if (p === sent) return
          var first = sent === ''
          sent = p
          var r = ''
          if (first && document.referrer) {
            try {
              var o = new URL(document.referrer).origin
              if (o !== location.origin) r = o
            } catch (e) {
              /* ignore */
            }
          }
          try {
            navigator.sendBeacon('/api/hit', JSON.stringify({ p: p, r: r }))
          } catch (e) {
            /* ignore */
          }
        }
        hit()
        var push = history.pushState
        history.pushState = function () {
          push.apply(this, arguments)
          hit()
        }
        addEventListener('popstate', hit)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
