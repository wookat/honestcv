<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pre-paint theme class; inlined and allowed via a CSP sha256 hash -->
    <!-- prettier-ignore -->
    <script>;(function(){try{var v=localStorage.getItem('honestcv.theme');if(v==='dark'||(v!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})()</script>
    <!-- prettier-ignore -->
    <meta name="description" content="RezUp: the AI resume builder that gets you interviews faster — free during beta. ATS-friendly templates, free ATS match score, AI rewrites, real PDF & DOCX export. Pay once if you ever pay; never a subscription." />
    <title>RezUp — AI Resume Builder. ATS-Friendly Resumes in Minutes.</title>
    <link rel="canonical" href="https://cv.zalize.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RezUp" />
    <meta property="og:title" content="RezUp — AI Resume Builder. ATS-Friendly Resumes in Minutes." />
    <!-- prettier-ignore -->
    <meta property="og:description" content="RezUp: the AI resume builder that gets you interviews faster — free during beta. ATS-friendly templates, free ATS match score, AI rewrites, real PDF & DOCX export." />
    <meta property="og:url" content="https://cv.zalize.com/" />
    <meta property="og:image" content="https://cv.zalize.com/og2.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RezUp",
        "url": "https://cv.zalize.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "AI resume builder with ATS-friendly templates, a free ATS match score, AI rewrites, and real PDF & DOCX export. One-time payment, no subscription — currently free during beta.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Will my resume pass ATS systems?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Our templates are single-column, real-text layouts — the format ATS parsers handle best. The PDF export is text-based (selectable, parseable), never an image, and the DOCX is a genuine Word document."
            }
          },
          {
            "@type": "Question",
            "name": "Where is my data stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In your browser (localStorage). We have no accounts and no resume database. The only content that reaches our server is text you explicitly send for AI rewriting, which is processed and returned, not stored."
            }
          }
        ]
      }
    </script>
    <!-- First-party pageview beacon; external file so CSP needs no inline scripts -->
    <script defer src="/t.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
